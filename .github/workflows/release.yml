name: Release

# Push a tag like v0.2.0 to:
#   1. publish glimpse-ui to npm (needs the NPM_TOKEN secret; skipped with a notice without it), and
#   2. build the desktop installers on macOS, Windows and Linux and attach them to a GitHub Release.
# Signing is optional: see docs/releasing.md for the secrets. Without them the installers are unsigned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package versions
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const want = tag.replace(/^v/, "");
            let ok = true;
            for (const file of ["packages/cli/package.json", "apps/desktop/package.json"]) {
              const { version } = require(`./${file}`);
              if (version !== want) {
                console.log(`::error file=${file}::version is ${version}, but the tag is ${tag}`);
                ok = false;
              }
            }
            if (!ok) process.exit(1);
            console.log(`Releasing ${want}`);
          '

  npm:
    name: Publish glimpse-ui to npm
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-test the packed tarball
        run: pnpm smoke:pack
      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice title=npm publish skipped::Add an NPM_TOKEN repository secret to publish glimpse-ui to npm."
            exit 0
          fi
          version="$(node -p 'require("./package.json").version')"
          if npm view "glimpse-ui@$version" version >/dev/null 2>&1; then
            echo "::notice title=npm publish skipped::glimpse-ui@$version is already on npm."
            exit 0
          fi
          provenance="--provenance"
          if [ "$PRIVATE_REPO" = "true" ]; then
            provenance=""
            echo "::notice::Private repository: publishing without provenance (npm requires a public source repo for it)."
          fi
          dist_tag="latest"
          case "$version" in *-*) dist_tag="next" ;; esac
          npm publish --access public --tag "$dist_tag" $provenance

  desktop:
    name: Installers (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A fixed Ubuntu image: what the Linux installers need from the system shouldn't change with "latest".
        os: [macos-latest, windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      # node-pty has no Linux prebuild, so npm compiled it against this runner's glibc (2.39 needs GLIBC_2.34 for
      # forkpty), and the real terminal wouldn't load on Ubuntu 20.04, Debian 11 or RHEL 8. Rebuild it on Debian 11
      # (glibc 2.31) and check what it needs.
      - name: Build node-pty for older Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w/apps/desktop -u "$(id -u):$(id -g)" -e HOME=/tmp node:22-bullseye npm rebuild node-pty
          pty=apps/desktop/node_modules/node-pty/build/Release/pty.node
          objdump -T "$pty" | grep -o 'GLIBC_[0-9.]*' | sort -uV
          if objdump -T "$pty" | grep -qE 'GLIBC_2\.(3[2-9]|[4-9][0-9])'; then echo "::error::$pty needs a newer glibc than 2.31"; exit 1; fi

      - name: Configure code signing (optional)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          put() { { echo "$1<<GLIMPSE_ENV_EOF"; printf '%s\n' "$2"; echo "GLIMPSE_ENV_EOF"; } >> "$GITHUB_ENV"; }
          signed=false
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            put CSC_LINK "$MAC_CSC_LINK"
            put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            signed=true
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              put APPLE_API_KEY "$RUNNER_TEMP/AuthKey.p8"
              put APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
              put APPLE_API_ISSUER "$APPLE_API_ISSUER"
              echo "macOS: signing and notarizing."
            else
              echo "macOS: signing (no APPLE_API_KEY_P8, so not notarizing)."
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            put WIN_CSC_LINK "$WIN_CSC_LINK"
            put WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
            signed=true
            echo "Windows: signing."
          fi
          if [ "$signed" = false ]; then
            put CSC_IDENTITY_AUTO_DISCOVERY false
            echo "::notice title=Unsigned build ($RUNNER_OS)::No signing secrets for this platform; the installers are unsigned."
          fi

      - name: Build installers
        working-directory: apps/desktop
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Set the repository variable RELEASE_DRAFT=true to review releases before they go public.
          draft: ${{ vars.RELEASE_DRAFT == 'true' }}
          fail_on_unmatched_files: true
