<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donut demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Donut Shop</h1>
      <p class="tagline">Five buttons and a donut that won't sit still.</p>
    </header>

    <div class="stage">
      <div class="donut" aria-label="A moving donut"></div>
    </div>

    <nav class="buttons">
      <button class="btn">Glazed</button>
      <button class="btn">Chocolate</button>
      <button class="btn">Sprinkles</button>
      <button class="btn">Maple</button>
      <button class="btn primary">Order now</button>
    </nav>
  </body>
</html>
